name: CI/CD Pipeline & Production Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality-and-security:
    name: Code Quality & DevSecOps Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Run PWA & Asset Integrity Verification
        run: |
          python3 scripts/verify-integrity.py

      - name: DevSecOps Secret Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'
        continue-on-error: false

      - name: Validate XML Sitemap & Robots
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('Sitemap XML parsed successfully.')
          "

      - name: Node ve kilitli test bağımlılıkları
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: JavaScript syntax gate
        run: npm run test:syntax

      - name: Playwright kurulumu
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium webkit

      - name: Saf transport regression testleri
        run: npm run test:unit

      - name: Chromium, WebKit ve PWA regression gate
        run: npm run test:smoke

      - name: WebKit terminal senkronizasyonu (5 ardışık tekrar)
        run: npx --no-install playwright test tests/hardening.spec.cjs --project=webkit --grep "terminal history" --repeat-each=5

      - name: Başarısız smoke kanıtları
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-smoke-hata-kanitlari
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Zero-Downtime GitHub Pages Deployment
    needs: quality-and-security
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup GitHub Pages Engine
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  post-deploy-smoke:
    name: Canlı yayın smoke doğrulaması
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test kaynakları
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node kurulumu
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Playwright kurulumu
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Canlı HTTP, boot, hero ve runtime smoke
        env:
          SMOKE_ADRESI: https://furkan-sarica.github.io/
        run: npm run test:production

      - name: Başarısız canlı smoke kanıtları
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canli-smoke-hata-kanitlari
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
